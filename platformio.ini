; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

monitor_filters = direct, default, send_on_enter
monitor_echo = yes

lib_deps =
    bogde/HX711 @ ^0.7.5
    waspinator/AccelStepper @ ^1.64

; Injects GIT_SHA (8-hex, FR-007 boot log) as a compile define.
extra_scripts = pre:scripts/build_git_sha.py

; Host-side unit tests for lib/FirmwareCore (pure C++, no Arduino).
; Run: pio test -e native
[env:native]
platform = native
test_framework = unity