; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; FastAccelStepper pushes the image past the default 1.25 MB app partition.
; The firmware uses no OTA and no SPIFFS, so huge_app.csv (3 MB app, no OTA)
; is safe; NVS stays at 0x9000, so the stored calibration survives.
board_build.partitions = huge_app.csv

monitor_filters = direct, default, send_on_enter
monitor_echo = yes

lib_deps =
    bogde/HX711 @ ^0.7.5
    ; FastAccelStepper: hardware-timed steps via the ESP32 RMT peripheral
    ; (smooth motion; replaces the AccelStepper polling task in Motion).
    ; Pinned to the commit after 1.4.0: "fix esp32 compile errors" makes the
    ; RMT sync manager conditional on SOC_RMT_SUPPORT_TX_SYNCHRO, which the
    ; ESP32 classic lacks. Drop the pin when a release contains it.
    https://github.com/gin66/FastAccelStepper.git#2bcc8e251f03389ed40543b8ab39fcc121f2b8b1

; Injects GIT_SHA (8-hex, FR-007 boot log) as a compile define.
extra_scripts = pre:scripts/build_git_sha.py

; Host-side unit tests for lib/FirmwareCore (pure C++, no Arduino).
; Run: pio test -e native
[env:native]
platform = native
test_framework = unity
; Explicit standard: Linux CI gcc defaults to gnu++17, but AppleClang
; (macOS workstations) defaults to C++98 and rejects constexpr/enum class.
; Pin the standard so host tests compile identically everywhere.
build_flags = -std=gnu++17
; ErrorCode.h is a pure (no Arduino.h) vocabulary header in src/ that the
; host tests include directly (T003 design).
test_include_dir = src