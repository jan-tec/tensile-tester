name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Detection half of the PR-only `main` rule (AGENTS.md "Push Guardrail", #100).
  # The "main protection" ruleset blocks direct pushes server-side since
  # 2026-10-11, but the repo admin can bypass it, so every push to main is still
  # audited here: squash-merged PRs always end their subject with "(#<n>)", a
  # direct push does not. Runs on push to `main` only, independent of build/test
  # (parallel on purpose: their results survive a guard fail, and guard is cheap
  # so it usually lands first).
  guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Audit new commits on main for a PR reference
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$zero" ]; then
            echo "No previous main (branch creation/reset): auditing $AFTER only."
            range=(-1 "$AFTER")
          else
            range=("$BEFORE..$AFTER")
          fi
          # A failing git log is fatal to the audit: a BEFORE that is missing or
          # not an ancestor (force-pushed/rewritten main) must turn the guard RED,
          # never pass. A mapfile < <(...) process substitution would swallow the
          # failure and leave `offenders` empty -> false green.
          if ! log=$(git log --no-merges --format='%h %s' "${range[@]}"); then
            printf '::error::cannot audit `%s` on main (rewritten history / missing objects)\n' "${range[*]}"
            exit 1
          fi
          offenders=()
          if [ -n "$log" ]; then
            mapfile -t offenders < <(printf '%s\n' "$log" | grep -vE '\(#[0-9]+\)$' || true)
          fi
          {
            echo "## main audit (#100)"
            echo
            echo "Audited range: \`${range[*]}\`"
            echo
            if [ "${#offenders[@]}" -eq 0 ]; then
              echo "All new commits reference a PR."
            else
              echo "Direct pushes to \`main\` (no \`(#<n>)\` in the subject):"
              echo
              echo '```'
              printf '%s\n' "${offenders[@]}"
              echo '```'
              echo
              echo "Undo: reset main to the previous commit, move the change to a branch,"
              echo "open a PR. Rules: AGENTS.md \"Push Guardrail\"."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#offenders[@]}" -gt 0 ]; then
            printf '::error::%s commit(s) reached main without a PR reference\n' "${#offenders[@]}"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO Core
        run: pip install platformio==6.1.19
      - name: Build
        run: pio run -e esp32dev

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-test-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO Core
        run: pip install platformio==6.1.19
      - name: Locale coverage gate (#89)
        run: python3 scripts/check_locale_coverage.py
      - name: Unit tests (host, env:native)
        run: pio test -e native
      - name: Small-stack smoke (#137)
        # No test may keep a large object (64 KB SampleBuffer-class) on a
        # test function's frame: a constrained stack (bench hosts, sandboxes)
        # overflows with SIGSEGV/__stack_chk_fail far from the cause. Run the
        # already-built binary under a 1 MB stack - Python/PIO stays outside
        # the limit, only the test binary runs inside it.
        run: |
          set -euo pipefail
          (ulimit -s 1024; exec .pio/build/native/program)
          echo "native binary passes under a 1 MB stack"
